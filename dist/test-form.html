<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Formspree Test</title>
</head>
<body>
    <h1>Direct Formspree Test</h1>

    <h2>Test 1: Simple HTML Form (No JavaScript)</h2>
    <form action="https://formspree.io/f/myzedzbl" method="POST">
        <input type="text" name="name" value="Test User" required><br>
        <input type="email" name="email" value="test@example.com" required><br>
        <select name="service_type" required>
            <option value="marketing">Marketing</option>
        </select><br>
        <textarea name="message" required>Test message from simple HTML form</textarea><br>
        <button type="submit">Submit HTML Form</button>
    </form>

    <hr>

    <h2>Test 2: JavaScript URLSearchParams</h2>
    <form id="jsForm" action="https://formspree.io/f/myzedzbl" method="POST">
        <input type="text" name="name" value="JS Test User" required><br>
        <input type="email" name="email" value="jstest@example.com" required><br>
        <select name="service_type" required>
            <option value="sourcing">Sourcing</option>
        </select><br>
        <textarea name="message" required>Test message from JavaScript form</textarea><br>
        <button type="submit">Submit JS Form</button>
    </form>

    <div id="result"></div>

    <script>
    document.getElementById('jsForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const form = e.target;
        const formData = new FormData(form);
        const urlParams = new URLSearchParams();

        // Convert to URLSearchParams
        for (const [key, value] of formData.entries()) {
            urlParams.append(key, value);
            console.log(`${key}: ${value}`);
        }

        console.log('Sending:', urlParams.toString());

        try {
            const response = await fetch(form.action, {
                method: 'POST',
                body: urlParams.toString(),
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                    'Accept': 'application/json'
                }
            });

            const result = document.getElementById('result');
            if (response.ok) {
                result.innerHTML = '<p style="color:green">Success! Check Formspree dashboard.</p>';
            } else {
                const text = await response.text();
                result.innerHTML = `<p style="color:red">Error ${response.status}: ${text}</p>`;
            }
        } catch (error) {
            document.getElementById('result').innerHTML = `<p style="color:red">Error: ${error.message}</p>`;
        }
    });
    </script>
</body>
</html>
